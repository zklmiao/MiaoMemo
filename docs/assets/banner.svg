<svg width="920" height="250" viewBox="0 0 920 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MiaoMemo banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1E1B4B" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="920" height="250" rx="18" fill="url(#bg)"/>
  <rect width="920" height="250" rx="18" fill="url(#sheen)"/>

  <!-- paw prints -->
  <g fill="#FFFFFF" opacity="0.10">
    <g transform="translate(70,205) scale(1.15)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-11" r="5"/>
      <circle cx="-4" cy="-15" r="5"/>
      <circle cx="5" cy="-14" r="5"/>
      <circle cx="13" cy="-9" r="5"/>
    </g>
    <g transform="translate(860,40) scale(0.9)">
      <ellipse cx="0" cy="0" rx="13" ry="10"/>
      <circle cx="-13" cy="-11" r="5"/>
      <circle cx="-4" cy="-15" r="5"/>
      <circle cx="5" cy="-14" r="5"/>
      <circle cx="13" cy="-9" r="5"/>
    </g>
  </g>

  <!-- sticky note 1: yellow, checklist -->
  <g transform="translate(66,52) rotate(-8)" filter="url(#card)">
    <rect width="138" height="150" rx="10" fill="#FFF8DC"/>
    <rect x="16" y="18" width="72" height="9" rx="4.5" fill="#C7B57A" opacity="0.9"/>
    <g fill="#B7A15E">
      <rect x="16" y="48" width="10" height="10" rx="3" fill="#A78BFA" stroke="#8B5CF6" stroke-width="0"/>
      <rect x="18" y="50" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
      <rect x="34" y="49" width="82" height="8" rx="4" opacity="0.75"/>
      <rect x="16" y="76" width="10" height="10" rx="3" fill="#8B5CF6"/>
      <path d="M18 81 l2.6 2.8 4.6-5.4" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <rect x="34" y="77" width="66" height="8" rx="4" opacity="0.75"/>
      <rect x="16" y="104" width="10" height="10" rx="3" fill="none" stroke="#B7A15E" stroke-width="1.6"/>
      <rect x="34" y="105" width="74" height="8" rx="4" opacity="0.75"/>
    </g>
    <rect x="16" y="128" width="46" height="8" rx="4" fill="#B7A15E" opacity="0.45"/>
  </g>

  <!-- sticky note 2: pink, title + text -->
  <g transform="translate(226,34) rotate(5)" filter="url(#card)">
    <rect width="146" height="156" rx="10" fill="#FDE7F0"/>
    <rect x="16" y="16" width="88" height="10" rx="5" fill="#D98CA9"/>
    <rect x="16" y="44" width="112" height="7" rx="3.5" fill="#D98CA9" opacity="0.55"/>
    <rect x="16" y="60" width="100" height="7" rx="3.5" fill="#D98CA9" opacity="0.55"/>
    <rect x="16" y="76" width="110" height="7" rx="3.5" fill="#D98CA9" opacity="0.55"/>
    <rect x="16" y="92" width="84" height="7" rx="3.5" fill="#D98CA9" opacity="0.55"/>
    <rect x="16" y="118" width="52" height="20" rx="10" fill="#EC4899" opacity="0.85"/>
    <rect x="28" y="125" width="28" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- sticky note 3: white, bold line -->
  <g transform="translate(392,56) rotate(-4)" filter="url(#card)">
    <rect width="140" height="148" rx="10" fill="#FFFFFF"/>
    <rect x="16" y="18" width="64" height="9" rx="4.5" fill="#8B8FA8"/>
    <rect x="16" y="46" width="52" height="12" rx="6" fill="#6366F1" opacity="0.85"/>
    <rect x="74" y="46" width="34" height="12" rx="6" fill="#C7D2FE"/>
    <rect x="16" y="70" width="104" height="7" rx="3.5" fill="#8B8FA8" opacity="0.5"/>
    <rect x="16" y="86" width="94" height="7" rx="3.5" fill="#8B8FA8" opacity="0.5"/>
    <rect x="16" y="102" width="100" height="7" rx="3.5" fill="#8B8FA8" opacity="0.5"/>
    <rect x="16" y="118" width="58" height="7" rx="3.5" fill="#8B8FA8" opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <g fill="#FFFFFF">
    <text x="600" y="118" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="700" textLength="252" lengthAdjust="spacingAndGlyphs">MiaoMemo</text>
    <text x="602" y="152" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" opacity="0.88">极简 · 悬浮 · 亚克力便签</text>
    <text x="602" y="180" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" opacity="0.66">Tauri 2 + Rust · Windows</text>
  </g>
  <g transform="translate(852,196)" fill="#FFFFFF" opacity="0.9">
    <ellipse cx="0" cy="6" rx="11" ry="9"/>
    <circle cx="-11" cy="-4" r="4.4"/>
    <circle cx="-3.5" cy="-8" r="4.4"/>
    <circle cx="4" cy="-7.5" r="4.4"/>
    <circle cx="11" cy="-3" r="4.4"/>
  </g>
</svg>
